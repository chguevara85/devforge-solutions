<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DevForge Solutions | Crear cuenta</title>
	<link rel="stylesheet" href="css/estilos.css">
</head>
<body class="auth-page">
	<main class="auth-shell auth-shell-single">
		<section class="auth-card" aria-labelledby="register-title">
			<a class="back-link" href="index.html">Volver al inicio de sesión</a>
			<div class="brand-mark">DF</div>
			<p class="eyebrow">Nuevo usuario</p>
			<h1 id="register-title">Crear una cuenta</h1>
			<p class="muted-text">Regístrate para gestionar tus proyectos en DevForge Solutions.</p>

			<form action="php/registro.php" method="post">
				<label for="nombre">Nombre completo</label>
				<input type="text" id="nombre" name="nombre" autocomplete="name" minlength="3" required>

				<label for="email">Correo electrónico</label>
				<input type="email" id="email" name="email" autocomplete="email" required>

				<label for="password">Contraseña</label>
				<input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>

				<button type="submit">Crear cuenta</button>
			</form>
		</section>
	</main>
</body>
</html>
